<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Full-bleed artwork; scripts/build-icon.py fits it into the macOS icon shape.
       Kept to a few bold shapes so it stays crisp at Dock sizes. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffa24f" />
      <stop offset="0.5" stop-color="#f4505f" />
      <stop offset="1" stop-color="#b8338f" />
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="term" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2725" />
      <stop offset="1" stop-color="#141312" />
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#5a0f2e" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)" />
  <rect width="1024" height="1024" fill="url(#sheen)" />

  <!-- Connector -->
  <path d="M 330 440 C 330 640, 330 690, 470 690" fill="none" stroke="#ffffff" stroke-width="40" stroke-linecap="round" filter="url(#lift)" />

  <!-- Prompt card -->
  <g filter="url(#lift)">
    <rect x="150" y="150" width="440" height="300" rx="66" fill="#ffffff" />
  </g>
  <rect x="216" y="232" width="290" height="44" rx="22" fill="#2a2725" />
  <rect x="216" y="318" width="200" height="44" rx="22" fill="#2a2725" fill-opacity="0.28" />

  <!-- Terminal card -->
  <g filter="url(#lift)">
    <rect x="434" y="522" width="440" height="352" rx="70" fill="url(#term)" />
  </g>
  <path d="M 520 618 L 600 690 L 520 762" fill="none" stroke="#ffa24f" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="640" y="726" width="140" height="44" rx="22" fill="#ffffff" />
</svg>
